version: "3.8"

services:
  # =====================================================================
  # Service 1: MySQL Enterprise Database
  # =====================================================================
  mysql-db:
    image: mysql:8.0
    container_name: auditor-mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: enterprise_secret_pass
      MYSQL_DATABASE: fairness_auditor_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - auditor-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-penterprise_secret_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # =====================================================================
  # Service 2: Spring Boot API Gateway & Python Agent Runtime (Hybrid)
  # =====================================================================
  api-gateway:
    build:
      context: .
      dockerfile: backend-spring/Dockerfile
    container_name: auditor-api-gateway
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/fairness_auditor_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: enterprise_secret_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      AGENT_ENGINE_PYTHON_PATH: python3
      AGENT_ENGINE_SCRIPT_PATH: /app/engine/agent.py
      AGENT_ENGINE_WORKING_DIR: /app/engine
      INTERACTIVE_CLI_HITL: "true"
    ports:
      - "5000:5000"
    networks:
      - auditor-network

  # =====================================================================
  # Service 3: React Production Web Dashboard (Served by Nginx)
  # =====================================================================
  web-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auditor-web-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "8080:80"
    networks:
      - auditor-network

# =====================================================================
# Persistent Volumes & Isolated Bridge Network
# =====================================================================
volumes:
  mysql_data:
    driver: local

networks:
  auditor-network:
    driver: bridge
