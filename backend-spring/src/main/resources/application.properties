# Server Configuration (matches React frontend target port)
server.port=5000

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/fairness_auditor_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_secure_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Python Engine Configuration
agent.engine.python-path=python
agent.engine.script-path=../engine/agent.py
agent.engine.working-dir=../engine
